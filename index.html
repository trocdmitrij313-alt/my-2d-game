<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Моя 2D игра</title>
</head>

<body>
    <h1>🎮 Моя первая 2D игра</h1>

    <canvas id="game" width="800" height="450"></canvas>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        // Игрок
        const player = {
            x: 100,
            y: 330,
            width: 50,
            height: 50,
            speed: 5,
            velocityY: 0,
            jumping: false
        };

        // Управление
        const keys = {};

        document.addEventListener("keydown", (event) => {
            keys[event.key] = true;

            if (event.code === "Space" && !player.jumping) {
                player.velocityY = -12;
                player.jumping = true;
            }
        });

        document.addEventListener("keyup", (event) => {
            keys[event.key] = false;
        });

        function update() {
            // Движение влево
            if (keys["ArrowLeft"]) {
                player.x -= player.speed;
            }

            // Движение вправо
            if (keys["ArrowRight"]) {
                player.x += player.speed;
            }

            // Гравитация
            player.velocityY += 0.5;
            player.y += player.velocityY;

            // Земля
            if (player.y + player.height >= 380) {
                player.y = 380 - player.height;
                player.velocityY = 0;
                player.jumping = false;
            }

            // Не даём уйти за края
            if (player.x < 0) {
                player.x = 0;
            }

            if (player.x + player.width > canvas.width) {
                player.x = canvas.width - player.width;
            }
        }

        function draw() {
            // Небо
            ctx.fillStyle = "skyblue";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Земля
            ctx.fillStyle = "green";
            ctx.fillRect(0, 380, canvas.width, 70);

            // Игрок
            ctx.fillStyle = "red";
            ctx.fillRect(
                player.x,
                player.y,
                player.width,
                player.height
            );
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
