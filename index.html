<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Приключение Тони Старка</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin: 10px;
        }

        canvas {
            border: 3px solid white;
            max-width: 95%;
            background: skyblue;
        }

        p {
            margin: 8px;
        }
    </style>
</head>

<body>

<h1>⚡ Приключение Тони Старка ⚡</h1>

<p>
    ← → — движение &nbsp;&nbsp; SPACE — прыжок
</p>

<canvas id="game" width="900" height="500"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");


// =========================
// ИГРОК
// =========================

const player = {
    x: 50,
    y: 350,
    width: 40,
    height: 50,

    speed: 5,
    velocityY: 0,

    jumping: false,

    lives: 3,
    score: 0
};


// =========================
// УПРАВЛЕНИЕ
// =========================

const keys = {};

document.addEventListener("keydown", function(event) {

    keys[event.key] = true;

    if (
        (event.code === "Space" || event.key === "ArrowUp") &&
        !player.jumping
    ) {
        player.velocityY = -13;
        player.jumping = true;
    }

});

document.addEventListener("keyup", function(event) {
    keys[event.key] = false;
});


// =========================
// ПЛАТФОРМЫ
// =========================

const platforms = [

    {
        x: 0,
        y: 450,
        width: 900,
        height: 50
    },

    {
        x: 150,
        y: 370,
        width: 140,
        height: 20
    },

    {
        x: 350,
        y: 300,
        width: 150,
        height: 20
    },

    {
        x: 580,
        y: 360,
        width: 130,
        height: 20
    },

    {
        x: 750,
        y: 270,
        width: 120,
        height: 20
    }
];


// =========================
// МОНЕТКИ
// =========================

const coins = [

    { x: 200, y: 330, collected: false },
    { x: 400, y: 260, collected: false },
    { x: 630, y: 320, collected: false },
    { x: 800, y: 230, collected: false }
];


// =========================
// ВРАГИ
// =========================

const enemies = [

    {
        x: 300,
        y: 410,
        width: 40,
        height: 40,
        speed: 2,
        direction: 1
    },

    {
        x: 600,
        y: 320,
        width: 40,
        height: 40,
        speed: 2,
        direction: 1
    }
];


// =========================
// ФИНИШ
// =========================

const finish = {
    x: 820,
    y: 210,
    width: 30,
    height: 60
};


// =========================
// СТОЛКНОВЕНИЕ
// =========================

function collision(a, b) {

    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );

}


// =========================
// СБРОС ИГРОКА
// =========================

function resetPlayer() {

    player.x = 50;
    player.y = 350;

    player.velocityY = 0;
    player.jumping = false;

}


// =========================
// ПРОИГРЫШ
// =========================

function loseLife() {

    player.lives--;

    resetPlayer();

    if (player.lives <= 0) {

        alert(
            "💀 Игра окончена!\n\n" +
            "Твои очки: " + player.score
        );

        location.reload();
    }

}


// =========================
// ОБНОВЛЕНИЕ ИГРЫ
// =========================

function update() {

    // Движение

    if (keys["ArrowLeft"]) {
        player.x -= player.speed;
    }

    if (keys["ArrowRight"]) {
        player.x += player.speed;
    }


    // Гравитация

    player.velocityY += 0.6;

    player.y += player.velocityY;


    // Проверяем платформы

    player.jumping = true;

    for (let platform of platforms) {

        if (

            player.x + player.width > platform.x &&
            player.x < platform.x + platform.width &&

            player.y + player.height >= platform.y &&
            player.y + player.height <= platform.y + platform.height + 15 &&

            player.velocityY >= 0

        ) {

            player.y = platform.y - player.height;

            player.velocityY = 0;

            player.jumping = false;
        }
    }


    // Края экрана

    if (player.x < 0) {
        player.x = 0;
    }

    if (player.x + player.width > canvas.width) {
        player.x = canvas.width - player.width;
    }


    // Если упал

    if (player.y > canvas.height) {

        loseLife();

    }


    // =========================
    // МОНЕТКИ
    // =========================

    for (let coin of coins) {

        const coinBox = {
            x: coin.x - 10,
            y: coin.y - 10,
            width: 20,
            height: 20
        };

        if (!coin.collected && collision(player, coinBox)) {

            coin.collected = true;

            player.score += 10;
        }
    }


    // =========================
    // ВРАГИ
    // =========================

    for (let enemy of enemies) {

        enemy.x += enemy.speed * enemy.direction;


        // Враг ходит туда-сюда

        if (enemy.x < 250 || enemy.x > 700) {

            enemy.direction *= -1;

        }


        // Игрок столкнулся с врагом

        if (collision(player, enemy)) {

            loseLife();

        }

    }


    // =========================
    // ФИНИШ
    // =========================

    if (collision(player, finish)) {

        alert(
            "🏆 ПОБЕДА!\n\n" +
            "Ты прошёл уровень!\n" +
            "Очки: " + player.score
        );

        location.reload();

    }

}


// =========================
// РИСОВАНИЕ
// =========================

function draw() {

    // Небо

    ctx.fillStyle = "#70cfff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Солнце

    ctx.fillStyle = "yellow";

    ctx.beginPath();

    ctx.arc(
        780,
        70,
        40,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Облака

    ctx.fillStyle = "white";

    ctx.fillRect(80, 70, 100, 25);
    ctx.fillRect(110, 50, 50, 35);

    ctx.fillRect(400, 80, 120, 25);
    ctx.fillRect(430, 60, 50, 35);


    // Земля и платформы

    for (let platform of platforms) {

        ctx.fillStyle = "#4caf50";

        ctx.fillRect(
            platform.x,
            platform.y,
            platform.width,
            platform.height
        );

    }


    // =========================
    // МОНЕТКИ
    // =========================

    for (let coin of coins) {

        if (!coin.collected) {

            ctx.fillStyle = "gold";

            ctx.beginPath();

            ctx.arc(
                coin.x,
                coin.y,
                10,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }

    }


    // =========================
    // ВРАГИ
    // =========================

    for (let enemy of enemies) {

        ctx.fillStyle = "purple";

        ctx.fillRect(
            enemy.x,
            enemy.y,
            enemy.width,
            enemy.height
        );


        // Глаза

        ctx.fillStyle = "white";

        ctx.fillRect(
            enemy.x + 8,
            enemy.y + 8,
            8,
            8
        );

        ctx.fillRect(
            enemy.x + 24,
            enemy.y + 8,
            8,
            8
        );

    }


    // =========================
    // ИГРОК
    // =========================

    ctx.fillStyle = "red";

    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );


    // Лицо

    ctx.fillStyle = "#ffd1a9";

    ctx.fillRect(
        player.x + 10,
        player.y + 5,
        20,
        20
    );


    // =========================
    // ФИНИШ
    // =========================
    ctx.fillStyle = "black";

    ctx.fillRect(
        finish.x,
        finish.y,
        5,
        finish.height
    );

    ctx.fillStyle = "white";

    ctx.fillRect(
        finish.x + 5,
        finish.y,
        25,
        20
    );

    ctx.fillStyle = "black";

    ctx.fillRect(
        finish.x + 5,
        finish.y,
        10,
        10
    );


    // =========================
    // ИНФОРМАЦИЯ
    // =========================

    ctx.fillStyle = "black";

    ctx.font = "22px Arial";

    ctx.fillText(
        "❤️ Жизни: " + player.lives,
        20,
        30
    );

    ctx.fillText(
        "🪙 Очки: " + player.score,
        200,
        30
    );

}


// =========================
// ИГРОВОЙ ЦИКЛ
// =========================

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(gameLoop);

}

gameLoop();

</script>

</body>
</html>
